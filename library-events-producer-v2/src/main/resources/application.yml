spring:
  application:
    name: library-events-producer-v2
  profiles:
    active: dev          # override via -Dspring.profiles.active=stage|prod at runtime
  kafka:
    # bootstrap-servers and topic are set per-profile (see application-{dev|stage|prod}.yml)
    producer:
      acks: all # 0, 1, all
      transaction-id-prefix: library-events-tx-
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # value-serializer: org.apache.kafka.common.serialization.StringSerializer  # switch to this for StringSerializer testing
      properties:
        retry.backoff.ms: 1000
        enable.idempotence: true


app:
  api:
    base-path: /v1/libraryevent

management:
  endpoint:
    health:
      probes:
        enabled: true          # enables /actuator/health/liveness and /actuator/health/readiness
        add-additional-paths: true  # also exposes /livez and /readyz at root
      show-details: always
      group:
        readiness:
          include: readinessState,kafkaReadiness   # readiness fails when Kafka is unreachable
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # Suppresses "No static resource favicon.ico" noise logged by Spring MVC on every browser request
    org.springframework.web.servlet.resource: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

